name: pdf_engine
description: Deterministic PDF 1.7 generation from the doc_engine node tree — hand-written writer, A4 layout, tagged-structure and PDF/A options, annotations. No Flutter imports. PDF viewing is platform work and out of scope for this package.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  doc_engine:
    path: ../doc_engine

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
